name: Build PDF

on:
  workflow_dispatch:
    inputs:
      document:
        description: Какой документ собрать в PDF
        type: choice
        default: master-CV-ru.md
        # .md files on main; update this list when files are added or renamed
        options:
          - all
          - master-CV-ru.md
          - master-cv-en.md
          - devops-cv-ru.md
          - devops-cv-en.md
          - unity-gameplay-developer-cv-ru.md
          - unity-gameplay-developer-cv-en.md
          - unity-technical-developer-cv-ru.md
          - unity-technical-developer-cv-en.md

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends fonts-noto-core

      - name: Render
        id: render
        env:
          DOC: ${{ inputs.document }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DOC" = all ]; then files=$(ls *.md | grep -vx README.md); else files=$DOC; fi
          mkdir -p out
          for f in $files; do
            test -f "$f" || { echo "::error::$f не найден в ветке $GITHUB_REF_NAME"; exit 1; }
            name=${f%.md}
            python3 .github/scripts/render.py "$f" "out/$name.html"
            google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
              --virtual-time-budget=10000 --print-to-pdf="out/$name.pdf" "file://$PWD/out/$name.html"
            test -s "out/$name.pdf"
          done
          rm out/*.html
          echo "path=$([ "$DOC" = all ] && echo 'out/*.pdf' || echo "out/${DOC%.md}.pdf")" >> "$GITHUB_OUTPUT"

      # one document -> the PDF itself as artifact; all -> one zip
      - uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: ${{ steps.render.outputs.path }}
          archive: ${{ inputs.document == 'all' }}
          if-no-files-found: error
